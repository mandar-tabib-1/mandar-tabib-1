name: Update profile README

on:
  schedule:
    - cron: "17 5 * * *" # daily, 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/update-readme.js", ".github/workflows/update-readme.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh latest repositories and research videos
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/update-readme.js');
            await run({ github, core });

      - name: Commit changes
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh latest repos and videos"
          git push
